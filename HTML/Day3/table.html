<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table>
        <!--Header and Footer tag in HTML-->
        <thead>
            header 
        </thead>
        <tfoot>
            footer
        </tfoot>
        <tr>
        <th>Name</th>
        <th>Designation</th>
        <th>Favourite language</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>programmer</td>
            <td>Java</td>
        </tr>
        <tr>
            <!--Abbas will now occupy the 2 column space-->
            <!--2 Attributes named as "colspan" and "rowspan"-->
            <td colspan="2">abbas</td>
            <td>C++</td>
        </tr>

    </table>
</body>
</html>
