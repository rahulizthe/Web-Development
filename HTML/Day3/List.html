<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!--There are 3 types of list-->
    <!--Unordered List-->
    <ul>
        <li>Rahul</li>
        <li>Abbas</li>
        <li>harry</li>
    </ul>
    <!--Ordered List-->
    <ol>
        <li>Rahul</li>
        <li>Abbas</li>
        <li>harry</li>
    </ol>
    <!--Definition List-->
    <dl>
        <dt>HTML</dt>
        <dd>Also known as HYPERTEXT MARKUP LANGUAGE.
            and this is very interesting language to learn.
            i mean it is like fancy stuff.</dd>
        
    </dl>
</body>
</html>
